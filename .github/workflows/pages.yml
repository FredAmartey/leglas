name: Pages

# The site lives at https://leglas.vercel.app since 2026-09-01, built by
# Vercel from vercel.json on every push. GitHub Pages still answers at the
# old address because READMEs already published to npm link to it, so this
# deploys one page there that forwards every path to the new one. It runs
# only by hand: nothing about the site is built here any more.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  forward:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The same page at the root and as the 404, so /leglas/changelog/ and
      # anything else under the old address lands on its new counterpart.
      - run: |
          mkdir -p out
          cat > out/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Leglas has moved</title>
          <meta http-equiv="refresh" content="0; url=https://leglas.vercel.app/">
          <link rel="canonical" href="https://leglas.vercel.app/">
          <script>location.replace("https://leglas.vercel.app"+location.pathname.replace(/^\/leglas/,"")+location.search+location.hash)</script>
          <p>Leglas moved to <a href="https://leglas.vercel.app/">leglas.vercel.app</a>.</p>
          </html>
          HTML
          cp out/404.html out/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
