name: Publish

# Releases are tag-driven: land the version bump, push v<version>, and this
# publishes both packages. Nothing here holds a credential. npm trusts this
# workflow, in this repository, through OIDC, so the long-lived token that
# would otherwise sit in repository secrets does not exist at all. That is
# the point: a publish token is what the registry's worms harvest, and npm
# is removing direct publish from such tokens anyway.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token npm verifies

jobs:
  publish:
    # OIDC works only on cloud-hosted runners; a self-hosted one cannot publish.
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the surface check below diffs this tag against
      # the previous one, and a shallow clone has neither to compare with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6 # version comes from packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the version publishes the wrong thing, or
      # fails deep in the release with a confusing "already published".
      # plugin.json is in here too. It ships nowhere, so nothing downstream
      # would ever complain about it being stale, which is exactly why it
      # drifts unless the release refuses to run without it.
      - name: Refuse a tag that does not match the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for manifest in packages/cli/package.json packages/mcp/package.json plugin.json; do
            declared=$(node -p "require('./$manifest').version")
            if [ "$tagged" != "$declared" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $manifest at $declared." >&2
              exit 1
            fi
          done

      # A patch release promises that nothing an importer depends on has moved.
      # Both packages ship types, so an exported signature is part of that
      # promise, and #6 changed two of them without anything objecting. The
      # snapshot is committed, so the question is answerable here with a diff
      # rather than by building the old tag and comparing it.
      - name: Refuse a patch tag when the public surface moved
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "No earlier tag to compare against."
            exit 0
          fi

          # A patch shares the major and the minor with the tag before it.
          # Anything else is already announcing a change, so it may move.
          prior="${previous#v}"
          if [ "${tagged%.*}" != "${prior%.*}" ]; then
            echo "$GITHUB_REF_NAME is not a patch of $previous; the surface may move freely."
            exit 0
          fi

          if ! git diff --quiet "$previous" HEAD -- api-surface.txt; then
            echo "::error::$GITHUB_REF_NAME is a patch tag, but the public API surface changed since $previous." >&2
            git diff "$previous" HEAD -- api-surface.txt >&2
            echo "Release this as a minor instead, or revert the signature change." >&2
            exit 1
          fi
          echo "Patch tag and the surface is unchanged since $previous."

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # pnpm rather than npm: leglas-mcp depends on leglas through workspace:^,
      # and pnpm is what rewrites that to a real range when packing.
      # --no-git-checks because a tag is a detached HEAD, and prepack writes the
      # README into the package directory before packing.
      #
      # No NODE_AUTH_TOKEN anywhere, deliberately. npm falls back to OIDC only
      # when it finds no token, and an empty string counts as a token.
      - name: Publish leglas
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/cli

      - name: Publish leglas-mcp
        run: pnpm publish --access public --no-git-checks
        working-directory: packages/mcp
