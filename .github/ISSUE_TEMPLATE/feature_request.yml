name: Feature request
description: Something Leglas should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation rather than the feature. What gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working, if you have a shape in mind.
  - type: textarea
    id: today
    attributes:
      label: What you do instead today
